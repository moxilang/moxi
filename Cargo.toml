[package]
name    = "moxi"
version = "0.3.0"
edition = "2021"
authors = ["Andrew Garcia"]
description = "Moxi v3 — semantic spatial description language for 3D worlds"
license = "Apache-2.0"
repository = "https://github.com/moxilang/moxi"

[[bin]]
name = "moxi"
path = "src/main.rs"

[lib]
name = "moxi_lib"
path = "src/lib.rs"
# cdylib for the WebAssembly target, rlib for the native bin/tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow     = "1.0"
clap       = { version = "4.4", features = ["derive"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
unicode-segmentation = "1.10"

# Bevy is optional — only compiled with:  cargo build --features viewer
bevy = { version = "0.13", optional = true }

# WebAssembly bindings — only with:  --features wasm
wasm-bindgen = { version = "0.2", optional = true }

[features]
viewer = ["bevy"]
wasm   = ["wasm-bindgen"]

# Deliberate exceptions, so `cargo clippy -- -D warnings` can be a real gate.
# Everything not listed here is expected to be fixed, not silenced.
[lints.clippy]
# Vec3/Mat3 expose add/sub/neg/scale/dot/cross as one uniform inherent math
# vocabulary. Implementing std::ops for three of them would split the API
# across two idioms — scale/dot/cross have no operator form.
should_implement_trait = "allow"

# The 3x3 matrix routines index by (row, col) on purpose; enumerate() over
# iter_mut() obscures the linear algebra they transcribe.
needless_range_loop = "allow"

# Tuple-shaped intermediates: voxel AABBs, cube geometry, solved parts.
# Naming them would add types without adding meaning.
type_complexity = "allow"