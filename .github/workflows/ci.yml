name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Default features only: the viewer pulls Bevy, which is slow and needs
      # system libs.
      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose

      # -D warnings is scoped to this step on purpose. At the workflow level it
      # would also fail Build and Test on a stray unused variable, which is
      # noise rather than a gate. Deliberate lint exceptions live in the
      # [lints.clippy] table in Cargo.toml.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          RUSTFLAGS: -D warnings

  scripts:
    name: example scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --locked --release

      # Every script in scripts/ must compile at all times. This is the
      # regression net for language changes: a PR that breaks ISLAND.md or
      # SKELETON_v2.md fails here rather than in someone's viewer.
      - name: Check all scripts
        run: |
          fail=0
          for f in scripts/*.md; do
            if ./target/release/moxi check "$f" > /dev/null 2>&1; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"
              ./target/release/moxi check "$f" || true
              fail=1
            fi
          done
          exit $fail

      # The JSON surface is what the web and WASM targets consume. If it stops
      # being valid JSON, every downstream host breaks silently.
      - name: JSON surface is well-formed
        run: |
          for f in scripts/*.md; do
            ./target/release/moxi json "$f" | jq -e '.ok == true' > /dev/null \
              || { echo "bad JSON or ok:false for $f"; exit 1; }
          done

      # Compilation must be a pure function of the source. This caught a real
      # bug: generator candidates were collected from a HashMap, whose
      # iteration order is seeded per process, so `seed` did not actually pin
      # tree placement in ISLAND.md. Three runs, one hash.
      - name: Output is deterministic across runs
        run: |
          fail=0
          for f in scripts/*.md; do
            a=$(./target/release/moxi json "$f" | sha256sum | cut -d' ' -f1)
            b=$(./target/release/moxi json "$f" | sha256sum | cut -d' ' -f1)
            c=$(./target/release/moxi json "$f" | sha256sum | cut -d' ' -f1)
            if [ "$a" = "$b" ] && [ "$b" = "$c" ]; then
              echo "  stable  $f"
            else
              echo "  UNSTABLE $f"
              echo "    $a"
              echo "    $b"
              echo "    $c"
              fail=1
            fi
          done
          exit $fail

  wasm:
    name: wasm32 builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The raw-ABI target the browser sandbox loads. No wasm-bindgen needed.
      - name: Build wasm32
        run: cargo build --locked --release --lib --target wasm32-unknown-unknown

  # Enabled once `moxi skill` lands (issue M2). Until then it is a no-op that
  # documents the intent.
